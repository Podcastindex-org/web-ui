name: Validate JSONs

on:
  push:
    branches: [ master ]
    paths:
      - 'server/data/**.json'
  pull_request:
    branches: [ master ]
    paths:
      - 'server/data/**.json'
  workflow_dispatch:

jobs:
  verify-json-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON
        uses: dsanders11/json-schema-validate-action@f04ef3bca791388d2bd9ff3a50b27d1b2572158e # v2.1.0
        with:
          schema: ./server/data/apps-schema.json
          files: ./server/data/apps.json

# https://github.com/marketplace/actions/json-schema-validate
# Alternative
# https://github.com/OrRosenblatt/validate-json-action
